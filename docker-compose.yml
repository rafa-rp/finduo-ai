version: '3.8'

# With SQLite, Finduo AI uses an embedded database stored in a local file (finduo.db).
# No external database container (like PostgreSQL or MariaDB) is required to run in Docker.
#
# If you run the Go application inside a Docker container in the future,
# mount a volume to persist the SQLite file (e.g., ./data:/app/data).
services: {}

